spring:
  # H2 Database 설정
  datasource:
    driver-class-name: org.h2.Driver
    url: 'jdbc:h2:mem:test'
    username: user
    password: 12345678

  # H2 Console 설정
  h2:
    console:
      enabled: true
      path: /h2-console

  # JPA 설정
  jpa:
    hibernate:
      ddl-auto: create
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        show_sql: true

  # Redis 설정 (spring 안으로 들어와야 함!)
  data:
    redis:
      host: localhost
      port: 6379

  # Mail 설정 (spring 안으로 들어와야 함!)
  mail:
    host: smtp.gmail.com  # Gmail 서버로 변경
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true